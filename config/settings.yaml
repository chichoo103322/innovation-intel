# ============================================================
# 常州创新·对标快讯 —— 情报系统配置
# 当前管线：采集内容 → JSON → HTML → PDF（无需外部 AI API）
# ============================================================

# ---- 期号设置 ----
first_issue_date: "2026-07-05"

# ---- 情报采集四大核心维度 ----
dimensions:
  - name: "各地科技委动态"
    keywords:
      - "科技委 会议 部署"
      - "省委科技委 科技创新"
      - "先进城市 科技委 动态"
    target_cities: "北京 上海 深圳 广州 杭州 苏州 南京 合肥 武汉 成都 重庆 西安"
    sources: "科技部 各省科技厅 市科技局 科创委"

  - name: "上海（长三角）国创中心资讯"
    keywords:
      - "长三角 国际科技创新中心"
      - "上海 重大创新 园区 平台"
      - "长三角 科技创新 协同"
    target_cities: "上海 苏州 杭州 南京 合肥 宁波 无锡"
    sources: "上海科委 长三角科创平台 张江 苏州工业园区"

  - name: "科创政策速览"
    keywords:
      - "科技创新政策 2026"
      - "高新技术产业 扶持政策"
      - "万亿城市 创新政策"
    target_cities: "京津冀 长三角 大湾区 成都 重庆 武汉 西安 29座万亿GDP城市"
    sources: "各市科技局 发改委 工信局"

  - name: "改革举措"
    keywords:
      - "科技体制改革 措施"
      - "科技金融 改革"
      - "科技成果转化 改革"
    target_cities: "京津冀 长三角 大湾区 成都 重庆 武汉 西安 29座万亿GDP城市"
    sources: "科技部 各省科技厅 市科技局"

# ---- 重点信息渠道 ----
priority_sources:
  政务官方:
    国家级:
      - "科技部官网"
      - "工信部官网"
      - "国家发改委官网"
      - "国家知识产权局官网"
    省级:
      - "江苏省科技厅官网"
      - "上海市科委官网"
      - "浙江省科技厅官网"
      - "广东省科技厅官网"
    市级:
      cities: "北京 上海 深圳 广州 杭州 苏州 南京 合肥 武汉 成都 重庆 西安 无锡 宁波 南通"
  权威平台:
    - "中国科学院官网"
    - "中国工程院官网"
    - "科技日报"
    - "中国科技网"
  媒体智库:
    - "瞭望智库"
    - "赛迪智库"
    - "长城战略咨询"
    - "中国信通院CAICT"
    - "36氪研究院"

# ---- 重点关注城市群 ----
focus_regions:
  - "京津冀城市群"
  - "长三角城市群"
  - "粤港澳大湾区城市群"
  - "中西部核心城市：成都 重庆 武汉 西安"

# ---- 日报生成规则 ----
daily:
  max_items_per_dimension: 3
  total_items_min: 8
  total_items_max: 12
  require_insight: true
  require_source_link: true
  insight_count: 3  # 每条出3版洞察（方案A/B/C）

# ---- 周报生成规则 ----
weekly:
  generate_on: "friday"

# ---- 月报生成规则 ----
monthly:
  generate_on: "last_day"

# ---- 输出路径 ----
# desktop_output_dir 留空则自动使用 ~/Desktop/创新情报（适用于任何用户）
desktop_output_dir: ""
